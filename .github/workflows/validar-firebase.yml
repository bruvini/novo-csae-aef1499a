name: Validar regras Firebase e integração

on:
  push:
    branches:
      - codex/regularizacao-cadastros
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Testes de segurança e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps # compatibilidade temporária: firebase@11 + rules-unit-testing@5; alinhar versões após validação
      - name: Verificar regras Firestore e Storage no Emulator
        run: npm run test:rules
      - name: Rodar testes da aplicação
        run: npm test
      - name: Testar filtros, exportação e tempo do PE
        run: npx tsx --test src/utils/painelEstatistico.test.ts src/utils/painelEstatisticoCache.test.ts src/utils/tempoProcesso.test.ts
      - name: Testar motor clínico por idade e contexto
        run: npx tsx --test src/utils/referenciasClinicas.test.ts
      - name: Testar proteção das chaves clínicas legadas
        run: npx tsx --test src/utils/protecaoCatalogoHistorico.test.ts
      - name: Testar qualidade do cadastro de exame fisico e vinculos NHB
        run: npx tsx --test src/utils/validacaoCadastroExameFisico.test.ts
      - name: Verificar carga aditiva dos protocolos sem Firebase remoto
        run: |
          python3 -m py_compile scripts/popular-catalogo-protocolos.py
          python3 -m unittest discover -s scripts/tests -p 'test_popular_catalogo_protocolos.py'
      - name: Testar conciliação nominal dos oito protocolos (sem Firebase remoto)
        run: python3 -m unittest discover -s scripts/tests -p 'test_auditar_cobertura_oito_protocolos.py'
      - name: Testar exportação restrita do inventário clínico dos 8 volumes
        run: python3 -m unittest discover -s scripts/tests -p 'test_exportar_inventario_clinico_8v.py'
      - name: Testar plano de FC pediátrica sem credenciais Firestore
        run: python3 -m unittest discover -s scripts/tests -p 'test_complementar_fc_pediatrica.py'
      - name: Testar correção de contexto clínico do hemograma
        run: python3 -m unittest discover -s scripts/tests -p 'test_contextualizar_hemograma.py'
      - name: Testar carga clínica transacional dos oito volumes
        run: python3 -m unittest discover -s scripts/tests -p 'test_aplicar_catalogo_clinico_8v_lote2.py'
      - name: Testar correções clínicas V3 (13 exames)
        run: python3 -m unittest discover -s scripts/tests -p 'test_corrigir_parametros_exames_csae_8v_v3.py'
      - name: Validar mudança de NHB nos exames hepatobiliares (V4)
        run: python3 -m unittest discover -s scripts/tests -p 'test_atualizar_nhb_hepatobiliar_v4.py'
      - name: Checar tipagem
        run: npx tsc -b
      - name: Compilar o portal
        run: npm run build
      - name: Verificar scripts de publicação
        run: |
          bash -n scripts/publicar-csae-cloudshell.sh
          python3 -m py_compile scripts/publicacao_csae_firestore.py
          python3 -m py_compile scripts/diagnosticar-perfis-legados.py
          bash -n scripts/regularizar-e-publicar-csae.sh
          bash -n scripts/diagnosticar-versao-publica.sh
          python3 -m py_compile scripts/migrar-perfis-legados.py
          python3 -m py_compile scripts/conferir-changelogs-csae.py
          python3 -m py_compile scripts/registrar-changelog-layout-pe.py
          bash -n scripts/publicar-layout-pe-cloudshell.sh
          python3 -m py_compile scripts/auditar-catalogo-clinico.py
      - name: Verificar proteção contra alterações locais no Cloud Shell
        run: |
          pattern='^ M \.firebase/hosting\.[[:alnum:]]+\.cache$'
          [[ -z "$(printf ' M .firebase/hosting.ZGlzdA.cache\n' | grep -Ev "$pattern" || true)" ]]
          [[ -n "$(printf ' M src/pages/Dashboard.tsx\n' | grep -Ev "$pattern" || true)" ]]
          [[ -n "$(printf '?? scripts/nova-alteracao.sh\n' | grep -Ev "$pattern" || true)" ]]
      - name: Verificar alterações
        run: git diff --check
